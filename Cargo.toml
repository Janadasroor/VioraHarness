[package]
name = "vioraharness"
version = "0.1.0"
edition = "2021"
description = "VioraHarness — custom coding agent harness for VioraEDA (Rust + Ratatui + OpenRouter/Gemini)"
license = "Apache-2.0"
repository = "https://github.com/Janadasroor/VioraEDA"
rust-version = "1.86"

[[bin]]
name = "vioraharness"
path = "src/main.rs"

[workspace]
members = ["crates/core", "crates/server", "crates/tui"]
resolver = "2"

[dependencies]
vioraharness-core = { path = "crates/core" }
vioraharness-server = { path = "crates/server" }
vioraharness-tui = { path = "crates/tui" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json","rustls-tls-manual-roots"] }

[dev-dependencies]
tempfile = "3"
