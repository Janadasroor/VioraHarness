[package]
name = "vioraharness-server"
version = "0.1.0"
edition = "2021"
description = "VioraHarness HTTP SSE server (axum) — sessionHarness Map, /session, /events"
license = "Apache-2.0"

[dependencies]
vioraharness-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
