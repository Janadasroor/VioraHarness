[package]
name = "vioraharness-core"
version = "0.1.0"
edition = "2021"
description = "VioraHarness kernel — loop, provider, tools, permissions, sandbox, context, session, subagents"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
jsonschema = "0.25"
reqwest = { version = "0.12", features = ["json","stream","rustls-tls-manual-roots"] }
eventsource-stream = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
futures = "0.3"
async-trait = "0.1"
async-recursion = "1"
base64 = "0.22"
glob = "0.3"
shell-words = "1.1"
sha2 = "0.10"
similar = "2.7"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
